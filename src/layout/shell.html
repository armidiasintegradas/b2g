<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="theme-color" content="#080b10">

  <!-- Open Graph / WhatsApp / Social Share -->
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="public/brand/b2g-whatsapp-share.png">
  <meta property="og:image:secure_url" content="public/brand/b2g-whatsapp-share.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="B2G Marketing Digital e Treinamentos">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{PAGE_TITLE}}">
  <meta name="twitter:description" content="{{PAGE_DESCRIPTION}}">
  <meta name="twitter:image" content="public/brand/b2g-whatsapp-share.png">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="public/brand/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="public/brand/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="public/brand/apple-touch-icon.png">
  <link rel="shortcut icon" href="public/brand/favicon.ico">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">

  <!-- dataLayer baseline initialization -->
  <script>
    window.dataLayer = window.dataLayer || [];
  </script>
</head>
<body>
  {{HEADER}}
  <main id="main-content">
    {{HERO}}
    {{SOLUCOES}}
    {{SISTEMA_AQUISICAO}}
    {{PERFORMANCE}}
    {{CTA_FINAL}}
  </main>
  {{FOOTER}}

  <!-- Telemetria & Tracking -->
  <script type="module">
    import { initTracking } from './lib/tracking.js';
    initTracking();
  </script>
</body>
</html>
